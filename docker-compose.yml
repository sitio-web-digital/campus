services:
  panel:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      # Opcional: fija el email/clave del admin en el PRIMER arranque.
      # Si no los definís, se generan y se muestran en los logs (docker compose logs panel).
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Clave de la API de Anthropic para el Asesor IA: se define en un archivo .env
      # junto a este compose (ANTHROPIC_API_KEY=sk-ant-...). NUNCA se commitea.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Clave de Google Places API (New) para el Panel de Clientes (prospección en Maps): va en el mismo .env.
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      # WhatsApp Cloud API (Meta): token permanente, ID del número y token de verificación del webhook. Van en el mismo .env.
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN:-}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      # Opcional (solo para tests): base de la API de Meta.
      - WHATSAPP_API_BASE=${WHATSAPP_API_BASE:-}
